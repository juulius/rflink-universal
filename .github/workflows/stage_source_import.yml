name: Stage RFLink source import

on:
  push:
    branches: [main, import/radioactive-direct-20261106]
    paths:
      - rflink-source-import.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Detect source archive
        id: archive
        shell: bash
        run: |
          if [ -f rflink-source-import.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No source archive found; this one-time import is already complete or has not been uploaded. Skipping staging."
          fi
      - name: Validate the single-file import archive
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/import_source_zip.py rflink-source-import.zip .rflink-stage
      - name: Create a review branch without executing imported code
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          branch="import/radioactive-${GITHUB_SHA:0:10}"
          git switch -c "$branch"
          cp -a .rflink-stage/. ./
          rm -rf .rflink-stage
          git rm -f rflink-source-import.zip
          git add repository.yaml firmware rflink_builder releases tests_previous tests_repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: stage v0.7 Radioactive firmware and Builder source for review"
          git push origin "HEAD:refs/heads/$branch"
          echo "Import staged on branch $branch."
          echo "Open a pull request to main after reviewing licenses, files and the tests."
