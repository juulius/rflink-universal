name: One-shot vendor official ESP Web Tools for in-app USB
on:
  push:
    branches: [feat/builder-modal-console-and-usb-flow]
    paths: ['.github/workflows/tmp_vendor_esp_web_tools.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned official browser flasher without package scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rflink-esptools
          cd /tmp/rflink-esptools
          npm pack esp-web-tools@10.4.0 --ignore-scripts --silent
          tar -xf esp-web-tools-10.4.0.tgz
          test -f package/dist/web/install-button.js
          ls -lh package/dist/web/
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src=Path('/tmp/rflink-esptools/package/dist/web')
          dest=Path('/home/runner/work/rflink-universal/rflink-universal/rflink_builder/static/vendor/esp-web-tools')
          dest.mkdir(parents=True,exist_ok=True)
          names=[]
          for path in src.rglob('*'):
              if not path.is_file():continue
              suffix=path.suffix.lower()
              if suffix not in {'.js','.css','.wasm','.svg','.json','.png','.ttf','.woff','.woff2'}:
                  raise SystemExit('Unexpected upstream runtime file: '+str(path))
              if path.stat().st_size>5000000:
                  raise SystemExit('Unexpectedly large upstream asset: '+str(path))
              destination=dest/path.relative_to(src)
              destination.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(path,destination)
              names.append((path.relative_to(src).as_posix(),path.stat().st_size))
          print('PINNED esp-web-tools 10.4.0:',len(names),'assets',sum(s for _,s in names),'bytes')
          for name,size in names:print(name,size)
          src_license=Path('/tmp/rflink-esptools/package/LICENSE')
          if not src_license.is_file():
              raise SystemExit('Missing upstream license')
          shutil.copy2(src_license,dest/'LICENSE')
          PY
      - name: Commit only vendored dependency to this branch
        shell: bash
        run: |
          set -euo pipefail
          git add rflink_builder/static/vendor/esp-web-tools
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'vendor(ui): pin ESP Web Tools 10.4.0 static browser flasher'
          git push origin HEAD:feat/builder-modal-console-and-usb-flow
