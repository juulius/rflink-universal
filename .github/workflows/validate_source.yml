name: RFLink source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      firmware_present: ${{ steps.detect.outputs.firmware_present }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect source
        id: detect
        shell: bash
        run: |
          if [ -f firmware/CMakeLists.txt ]; then
            echo "firmware_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "firmware_present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository instructions and docs
        run: |
          test -s AGENTS.md
          test -s docs/V0_7_STATUS.md
          test -s docs/GETTING_STARTED.md
      - name: Test Builder and source metadata (when present)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f rflink_builder/server.py ]; then
            echo "Source not imported yet: documentation-only repository."
            exit 0
          fi
          python -m compileall -q rflink_builder
          # Exercise the native C++ host simulation before the Builder bundle
          # gate, so hardware-model failures are visible even when packaging
          # has not been regenerated yet.
          cd firmware
          python tools/generate_board_header.py --check
          python tools/preflight.py
          bash tests/TEST_HOST.sh
          cd ..
          python -m unittest discover -s tests_repo -v
          python -m unittest discover -s tests_previous -v
          cd firmware
          python tools/source_manifest.py --verify
      - name: Check Builder JavaScript syntax (when present)
        shell: bash
        run: |
          if [ -f rflink_builder/static/app.js ]; then
            node --check rflink_builder/static/app.js
          fi
          if [ -f rflink_builder/static/devices.js ]; then
            node --check rflink_builder/static/devices.js
          fi
          if [ -f rflink_builder/static/wizard.js ]; then
            node --check rflink_builder/static/wizard.js
          fi
          if [ -f rflink_builder/static/device_firmware.js ]; then
            node --check rflink_builder/static/device_firmware.js
          fi
          if [ -f rflink_builder/static/firmware_catalog.js ]; then
            node --check rflink_builder/static/firmware_catalog.js
          fi
          if [ -f rflink_builder/static/browser_flash.js ]; then
            node --check rflink_builder/static/browser_flash.js
          fi
          if [ -f rflink_builder/static/rf_console.js ]; then
            node --check rflink_builder/static/rf_console.js
          fi
          if [ -f rflink_builder/static/rf_flash.js ]; then
            node --check rflink_builder/static/rf_flash.js
          fi
          if [ -f rflink_builder/static/memory_diag.js ]; then
            node --check rflink_builder/static/memory_diag.js
          fi
          if [ -f firmware/main/webui/app.js ]; then
            node --check firmware/main/webui/app.js
          fi

  release-plan:
    # The PR reports whether a version will be made on merge. It never tags
    # or publishes a release and cannot bypass the full firmware build.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate automatic firmware version or promotion request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          git fetch origin "$GITHUB_BASE_REF"
          python3 releases/release_auto.py pr-check \
            --base "origin/$GITHUB_BASE_REF" --head HEAD

  # A real ESP-IDF compile is a separate job, not a substitute for hardware tests.
  native-idf-build:
    needs: validate
    if: needs.validate.outputs.firmware_present == 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    # Build the exact next Experimental identity in CI. This is not a
    # published GitHub Release or a hardware-verified flash-ready binary.
    env:
      RFLINK_RELEASE_TAG: firmware/v0.7.0-exp.16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3eb54437c66cd735b0f079e3c54b19f6fe7ef0c
      - name: Compile the complete native firmware, when source exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f firmware/CMakeLists.txt ]; then
            echo "Firmware source not imported yet."
            exit 0
          fi
          # GitHub job containers do not run the Docker image ENTRYPOINT,
          # which normally activates ESP-IDF tools and the Python environment.
          # Source the official setup script explicitly in this step.
          : "${IDF_PATH:?The Espressif Docker image must set IDF_PATH}"
          test -f "$IDF_PATH/export.sh"
          . "$IDF_PATH/export.sh"
          command -v idf.py
          idf.py --version
          cd firmware
          python3 tools/generate_board_header.py --check
          python3 tools/preflight.py
          python3 tools/source_manifest.py --verify
          idf.py build
          # Temporary exact-build diagnostic for the reported exp.16 panic.
          # Build pinned release commit, not subsequent main/LED changes.
          echo '== EXP16 USB LOADPROHIBITED SYMBOLS =='
          xtensa-esp32s3-elf-addr2line -a -f -C -i \
            -e build/rflink_universal.elf \
            0x42024292 0x4202428f 0x420247fc 0x4039083a \
            0x4038e60c 0x42024581 0x4202b14f 0x42028f2a \
            0x42029248 0x4202a19b 0x4202a5fd 0x4202af15 \
            0x420289ab 0x42018a15 0x42012ad0 0x420c53af \
            0x40381749
          echo '== END EXP16 SYMBOLS =='
          python3 tools/package_release.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('release/release_manifest.json').read_text())
          assert data['release_tag']=='firmware/v0.7.0-exp.16'
          assert data['release_channel']=='experimental'
          assert data['release_build']==16
          assert data['version'].startswith('0.7.0-exp.16-n16r8-b')
          assert data['test_only'] is True
          print('PASS: exact Experimental v0.7.0 build 16 packaged (not hardware tested)')
          PY
          # This is the official ESP-IDF / esptool integration gate for PC
          # browser USB: merge REAL compiled images with disposable fake NVS,
          # never with a user's Wi-Fi or OTA credentials.
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd().parent/'rflink_builder'))
          from provisioning import create_nvs_image
          from browser_flash import browser_factory_image
          release=Path('release')
          data=json.loads((release/'release_manifest.json').read_text())
          nvs=release/'CI_ONLY_FAKE_CREDENTIALS.bin'
          try:
              meta=create_nvs_image(
                  {'wifi_ssid':'RFLink-CI-Only',
                   'wifi_password':'only-for-ci-not-real',
                   'key':'CI-ONLY-DO-NOT-USE-ON-DEVICES'},
                  nvs, Path(os.environ['IDF_PATH']), env=os.environ.copy())
              data['files']['provisioning_nvs']=meta
              data['builder_device_id']='ci-only'
              data['nvs_offset']=0x9000
              data['nvs_size_bytes']=0x10000
              factory=browser_factory_image(data,release,os.environ.copy())
              assert 0x20000 < len(factory) <= 16*1024*1024
              assert factory[0]==0xe9 and factory[0x20000]==0xe9
              print('PASS: REAL ESP-IDF binaries + fake NVS merged for browser USB (no hardware flash)')
          finally:
              nvs.unlink(missing_ok=True)
          PY
