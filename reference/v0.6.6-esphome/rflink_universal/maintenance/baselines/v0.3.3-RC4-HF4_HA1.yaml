# RFLink Universal v0.3.3 RC4-HF4 - UX2 PINOUT COMPILEFIX1 release (HF3 base; UX2 preserved) (RC3 baseline + WebHandler fix)
# HOME_ASSISTANT_BRIDGE1: optionele MQTT Discovery per ingeleerd RF-apparaat.
# RADIO-OPTIONAL UPDATE: no CC1101 modules required for WiFi, API, web or OTA.
# BOARD PINOUT: revised 2026-09-17 PCB; do NOT flash on older wiring unchanged.
# 433.42 + 433.92: raw OOK; 868.30: Itho 2-FSK packet.
# 868 profile is compile-time in this build; no runtime profile switching.
# RMT TX is used only by 433.42/433.92 raw OOK and onboard RGB, NOT 868 packet mode.
# This config keeps the user's existing secret NAMES and Itho virtual transmitter ID.
# No secret VALUES are stored in this package.
# Place accompanying rflink_universal/ folder next to this YAML in /config/esphome.

substitutions:
  # ===============================================================
  # CENTRALE PCB PINOUT - HF4 (20-09-2026)
  # Wijzig fysieke aansluitingen alleen in dit blok.
  # De 433 MHz radio's: GDO0 = TX, GDO2 = RX.
  # De 868 MHz radio: GDO0 = packet IRQ; GDO2 is gereserveerd.
  # ===============================================================
  board_revision: eigen_rfid_board_rev1

  # Gezamenlijke SPI-bus
  spi_sck: GPIO12
  spi_mosi: GPIO11
  spi_miso: GPIO13

  # Radio 1 - 433,42 MHz
  radio1_csn: GPIO5
  radio1_gdo0: GPIO6
  radio1_gdo2: GPIO4

  # Radio 2 - 433,92 MHz
  radio2_csn: GPIO9
  radio2_gdo0: GPIO8
  radio2_gdo2: GPIO10

  # Radio 3 - 868 MHz (Itho 868,30 MHz)
  radio3_csn: GPIO15
  radio3_gdo0: GPIO16
  radio3_gdo2: GPIO17  # Reserve: momenteel niet als ESPHome-pin gebruikt

  # LED: de UX2-bron had GPIO48 voor de WS2812 van het CH343P-board.
  # Alleen aanpassen naar GPIO47 als de led fysiek op GPIO47 zit.
  status_led_gpio: GPIO48

  # ===============================================================
  # Overige instellingen (geen GPIO)
  # ===============================================================
  name: rflink-universal
  friendly_name: RFLink Universal
  # Unique virtual remote ID before pairing; preserve existing bytes.
  itho_id1: '0x06'
  itho_id2: '0xCF'
  itho_id3: '0x4A'
  itho_device_type: '0x16'

# Enabled by default for THIS board. Disable this package when using an ESP32-S3
# board without an onboard WS2812 on GPIO48 (or with a GPIO47 solder-jumper variant).
packages:
  rgb_status: !include rflink_universal/options/rgb_status_ws2812.yaml
  # Optioneel: alleen inschakelen nadat MQTT-broker en secrets zijn ingesteld.
  # ha_mqtt: !include rflink_universal/options/ha_mqtt.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret rflink__encryption_key

ota:
  - platform: esphome
    password: !secret rflink__ota_password
    # OTA can pause the normal LED animation loop. Drive white from actual
    # progress callbacks as well; timing remains callback-dependent during OTA.
    on_begin:
      - lambda: |-
          id(rflink_core).led_ota(true);
          auto call = id(rflink_status_rgb).turn_on();
          call.set_transition_length(0);
          call.set_rgb(1.0f, 1.0f, 1.0f);
          call.set_brightness(id(rflink_core).status_led().brightness() / 100.0f);
          call.perform();
          // OTA blocks the normal main loop; explicitly service the light state
          // here so its queued color reaches the addressable LED driver.
          id(rflink_status_rgb).loop();
    on_progress:
      - lambda: |-
          const auto pixel = id(rflink_core).status_led().sample(millis());
          auto call = id(rflink_status_rgb).turn_on();
          call.set_transition_length(0);
          call.set_rgb(1.0f, 1.0f, 1.0f);
          call.set_brightness(pixel.brightness);
          call.perform();
          id(rflink_status_rgb).loop();
    on_end:
      - lambda: |-
          id(rflink_core).led_ota(false);
          // Restore the actual state: amber if a radio is missing, never a
          // misleading white/green success indication immediately before reboot.
          const auto pixel = id(rflink_core).status_led().sample(millis());
          if (pixel.brightness < 0.001f) {
            auto call = id(rflink_status_rgb).turn_off();
            call.set_transition_length(0);
            call.perform();
          } else {
            auto call = id(rflink_status_rgb).turn_on();
            call.set_transition_length(0);
            call.set_rgb(pixel.red, pixel.green, pixel.blue);
            call.set_brightness(pixel.brightness);
            call.perform();
          }
          id(rflink_status_rgb).loop();
    on_error:
      - lambda: |-
          id(rflink_core).led_ota(false);
          id(rflink_core).status_led().error(millis());
          auto call = id(rflink_status_rgb).turn_on();
          call.set_transition_length(0);
          call.set_rgb(1.0f, 0.0f, 0.0f);
          call.set_brightness(id(rflink_core).status_led().brightness() / 100.0f);
          call.perform();
          id(rflink_status_rgb).loop();

wifi:
  ssid: !secret wifi_ssid_iot
  password: !secret wifi_password_iot
  ap:
    ssid: "RFLink Universal Setup"
    password: !secret rflink_fallback_password

captive_portal:

external_components:
  - source:
      type: local
      path: rflink_universal/components

# GPIOs come exclusively from substitutions at the top. Do not hard-code them here.
# GPIO35/36 cannot be used with ESP32-S3 N16R8 Octal PSRAM.
# Existing onboard RGB default: GPIO48; change status_led_gpio for other boards.
spi:
  id: cc1101_spi
  clk_pin: ${spi_sck}
  mosi_pin: ${spi_mosi}
  miso_pin: ${spi_miso}
  interface: spi2

# 433 radios: raw ASK/OOK. GDO0 is driven directly by remote_transmitter,
# therefore it is intentionally NOT configured as gdo0_pin here.
cc1101:
  - id: cc1101_433_42
    spi_id: cc1101_spi
    cs_pin: ${radio1_csn}
    frequency: 433.42MHz
    modulation_type: ASK/OOK
    filter_bandwidth: 203kHz
    output_power: 0

  - id: cc1101_433_92
    spi_id: cc1101_spi
    cs_pin: ${radio2_csn}
    frequency: 433.92MHz
    modulation_type: ASK/OOK
    filter_bandwidth: 203kHz
    output_power: 0

  # Itho RFT packet profile. One CC1101 cannot listen to raw OOK and 2-FSK
  # simultaneously; choose the default profile if you need 868 OOK instead.
  - id: cc1101_868
    spi_id: cc1101_spi
    cs_pin: ${radio3_csn}
    gdo0_pin: ${radio3_gdo0}
    frequency: 868.2999MHz
    modulation_type: 2-FSK
    symbol_rate: 38383
    filter_bandwidth: 203kHz
    fsk_deviation: 50kHz
    manchester: false
    output_power: 0
    packet_mode: true
    packet_length: 63
    crc_enable: false
    whitening: false
    sync_mode: 16/16
    sync1: 0xAB
    sync0: 0xFE
    num_preamble: 4
    on_packet:
      then:
        - lambda: |-
            id(rflink_core).receive_packet(2, x, rssi, lqi, freq_offset);

remote_receiver:
  - id: rx_433_42
    # Hold an unconnected GDO2 low so the RMT receiver cannot read floating noise.
    pin:
      number: ${radio1_gdo2}
      mode: {input: true, pulldown: true}
    filter: 30us
    idle: 5ms
    tolerance: 25%
    buffer_size: 8kb
    # ESP32-S3 has only one DMA-capable RMT RX channel. Two DMA RX requests
    # compete for it and the second fails with "no free rx channels".
    # Split 192 RX symbols equally between two non-DMA receivers instead.
    use_dma: false
    rmt_symbols: 96
  - id: rx_433_92
    pin:
      number: ${radio2_gdo2}
      mode: {input: true, pulldown: true}
    filter: 30us
    idle: 5ms
    tolerance: 25%
    buffer_size: 8kb
    use_dma: false
    rmt_symbols: 96

remote_transmitter:
  - id: tx_433_42
    pin: ${radio1_gdo0}
    carrier_duty_percent: 100%
    # ESP32-S3: one 48-symbol TX block per OOK transmitter. The WS2812
    # reserves one more 48-symbol TX block; leave the fourth block free.
    # Do not use DMA here, and do not share TX and RX memory budgets.
    use_dma: false
    rmt_symbols: 48
    non_blocking: true
    on_transmit:
      then:
        - if:
            condition:
              lambda: 'return !id(cc1101_433_42).is_failed();'
            then:
              - if:
                  condition:
                    lambda: 'return !id(cc1101_433_92).is_failed();'
                  then:
                    - cc1101.set_idle: {id: cc1101_433_92}
              - cc1101.begin_tx: {id: cc1101_433_42}
              - lambda: 'id(rflink_core).record_tx_command(0, "OOK TX aangevraagd");'
              - lambda: 'id(rflink_core).led_tx();'
    on_complete:
      then:
        - if:
            condition:
              lambda: 'return !id(cc1101_433_42).is_failed();'
            then:
              - cc1101.begin_rx: {id: cc1101_433_42}
        - delay: 2ms
        - if:
            condition:
              lambda: 'return !id(cc1101_433_92).is_failed();'
            then:
              - cc1101.begin_rx: {id: cc1101_433_92}
  - id: tx_433_92
    pin: ${radio2_gdo0}
    carrier_duty_percent: 100%
    # ESP32-S3: one 48-symbol TX block per OOK transmitter. The WS2812
    # reserves one more 48-symbol TX block; leave the fourth block free.
    # Do not use DMA here, and do not share TX and RX memory budgets.
    use_dma: false
    rmt_symbols: 48
    non_blocking: true
    on_transmit:
      then:
        - if:
            condition:
              lambda: 'return !id(cc1101_433_92).is_failed();'
            then:
              - if:
                  condition:
                    lambda: 'return !id(cc1101_433_42).is_failed();'
                  then:
                    - cc1101.set_idle: {id: cc1101_433_42}
              - cc1101.begin_tx: {id: cc1101_433_92}
              - lambda: 'id(rflink_core).record_tx_command(1, "OOK TX aangevraagd");'
              - lambda: 'id(rflink_core).led_tx();'
    on_complete:
      then:
        - if:
            condition:
              lambda: 'return !id(cc1101_433_92).is_failed();'
            then:
              - cc1101.begin_rx: {id: cc1101_433_92}
        - delay: 2ms
        - if:
            condition:
              lambda: 'return !id(cc1101_433_42).is_failed();'
            then:
              - cc1101.begin_rx: {id: cc1101_433_42}

# Poll ESPHome's CC1101 setup result. A missing CC1101 is a non-fatal
# peripheral failure; the rest of the board must keep operating. A failed
# CC1101 is retried by restarting the board after connecting hardware.
interval:
  - interval: 2s
    then:
      - lambda: |-
          id(rflink_core).set_radio_available(0, !id(cc1101_433_42).is_failed(), !id(rx_433_42).is_failed(), !id(tx_433_42).is_failed());
          id(rflink_core).set_radio_available(1, !id(cc1101_433_92).is_failed(), !id(rx_433_92).is_failed(), !id(tx_433_92).is_failed());
          id(rflink_core).set_radio_available(2, !id(cc1101_868).is_failed(), true, true);

globals:
  - id: itho_counter
    type: uint8_t
    restore_value: yes
    update_interval: 250ms
    initial_value: '1'
  - id: itho_packet
    type: std::vector<uint8_t>
    restore_value: no

rflink_universal:
  ha_node: ${name}
  decoder_directory: rflink_universal/decoders
  id: rflink_core
  web_ui: true
  dedupe_window: 80ms
  candidate_threshold: 3
  channels:
    - name: "433.42"
      frequency: 433420000
      mode: raw
      receiver_id: rx_433_42
    - name: "433.92"
      frequency: 433920000
      mode: raw
      receiver_id: rx_433_92
    - name: "868.30 Itho"
      frequency: 868299900
      mode: packet

script:
  - id: itho_speed
    parameters:
      speed: int
    then:
      - lambda: 'id(rflink_core).led_tx();'
      - lambda: |-
          const std::array<uint8_t,3> rid{{${itho_id1}, ${itho_id2}, ${itho_id3}}};
          id(itho_counter)++;
          auto payload = esphome::rflink_universal::itho::build_speed_payload(
              ${itho_device_type}, rid, id(itho_counter),
              static_cast<esphome::rflink_universal::itho::SpeedCommand>(speed));
          id(itho_packet) = esphome::rflink_universal::itho::encode_payload(payload, 0xAC);
      - if:
          condition:
            lambda: 'return !id(cc1101_868).is_failed();'
          then:
            - lambda: |-
                id(rflink_core).record_tx_command(2, "Itho snelheid " + std::to_string(speed) + " (3x TX aangevraagd)");
            - repeat:
                count: 3
                then:
                  - cc1101.send_packet:
                      id: cc1101_868
                      data: !lambda 'return id(itho_packet);'
                  - delay: 40ms
          else:
            - logger.log:
                level: WARN
                format: 'Itho command ignored: 868 MHz radio not detected'

  - id: itho_pair
    parameters:
      compatibility: bool
    then:
      - lambda: 'id(rflink_core).led_pair_start();'
      - lambda: |-
          const std::array<uint8_t,3> rid{{${itho_id1}, ${itho_id2}, ${itho_id3}}};
          id(itho_counter)++;
          auto payload = esphome::rflink_universal::itho::build_join_payload(
              ${itho_device_type}, rid, id(itho_counter), compatibility);
          id(itho_packet) = esphome::rflink_universal::itho::encode_payload(payload, 0xCA);
      - if:
          condition:
            lambda: 'return !id(cc1101_868).is_failed();'
          then:
            - lambda: |-
                id(rflink_core).record_tx_command(2, compatibility ? "Itho pair compatibiliteit (10x TX aangevraagd)" : "Itho pair (10x TX aangevraagd)");
            - repeat:
                count: 10
                then:
                  - cc1101.send_packet:
                      id: cc1101_868
                      data: !lambda 'return id(itho_packet);'
                  - delay: 40ms
          else:
            - logger.log:
                level: WARN
                format: 'Itho command ignored: 868 MHz radio not detected'
      - lambda: 'id(rflink_core).led_pair_end();'

  - id: itho_unpair
    then:
      - lambda: 'id(rflink_core).led_tx();'
      - lambda: |-
          const std::array<uint8_t,3> rid{{${itho_id1}, ${itho_id2}, ${itho_id3}}};
          id(itho_counter)++;
          auto payload = esphome::rflink_universal::itho::build_leave_payload(
              ${itho_device_type}, rid, id(itho_counter));
          id(itho_packet) = esphome::rflink_universal::itho::encode_payload(payload, 0xCA);
      - if:
          condition:
            lambda: 'return !id(cc1101_868).is_failed();'
          then:
            - lambda: |-
                id(rflink_core).record_tx_command(2, "Itho unpair (30x TX aangevraagd)");
            - repeat:
                count: 30
                then:
                  - cc1101.send_packet:
                      id: cc1101_868
                      data: !lambda 'return id(itho_packet);'
                  - delay: 4ms
          else:
            - logger.log:
                level: WARN
                format: 'Itho command ignored: 868 MHz radio not detected'

button:
  - platform: template
    name: "Itho Standby"
    on_press: {then: [{script.execute: {id: itho_speed, speed: 1}}]}
  - platform: template
    name: "Itho Low"
    on_press: {then: [{script.execute: {id: itho_speed, speed: 2}}]}
  - platform: template
    name: "Itho Medium"
    on_press: {then: [{script.execute: {id: itho_speed, speed: 3}}]}
  - platform: template
    name: "Itho High"
    on_press: {then: [{script.execute: {id: itho_speed, speed: 4}}]}
  - platform: template
    name: "Itho Pair"
    on_press: {then: [{script.execute: {id: itho_pair, compatibility: false}}]}
  - platform: template
    name: "Itho Pair Compatibility"
    on_press: {then: [{script.execute: {id: itho_pair, compatibility: true}}]}
  - platform: template
    name: "Itho Unpair"
    on_press: {then: [{script.execute: itho_unpair}]}
  - platform: restart
    name: "RFLink Restart"

sensor:
  - platform: wifi_signal
    name: "RFLink WiFi RSSI"
    update_interval: 60s
  - platform: uptime
    name: "RFLink Uptime"
